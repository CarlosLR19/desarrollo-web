spring.application.name=chordlab
# Puerto y ruta base definidos en docs/04-api.md: http://localhost:8080/api
server.port=8080
server.servlet.context-path=/api
spring.datasource.url=jdbc:mysql://localhost:3306/chordlab
spring.datasource.username=chordlab
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false
